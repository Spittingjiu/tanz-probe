<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>持续测速 - Tarnz Probe</title>
  <link rel="icon" href="/icon-192.png" type="image/png">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f5f7ff', 100: '#ebf0fe', 500: '#4f46e5', 600: '#4338ca', 700: '#3730a3' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl 2xl:max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
      <!-- Left: Logo & Title -->
      <div class="flex items-center space-x-3">
        <a href="/" class="flex items-center space-x-2.5 group">
          <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm group-hover:scale-105 transition-all">
            <i data-lucide="activity" class="w-4 h-4"></i>
          </div>
          <span class="font-black text-slate-900 tracking-tight text-base sm:text-lg group-hover:text-indigo-600 transition-colors">Tarnz Probe</span>
        </a>
        <span class="text-slate-300">/</span>
        <div class="flex items-center space-x-1.5">
          <span class="font-bold text-slate-800 text-xs sm:text-sm">持续测速</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">实时网络质量探测</span>
        </div>
      </div>

      <!-- Right: Links & Actions -->
      <div class="flex items-center space-x-3">
        <a href="/" class="text-xs font-semibold text-slate-600 hover:text-indigo-600 flex items-center space-x-1 transition-colors">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>返回监控首页</span>
        </a>
        <a href="/admin" target="_blank" class="hidden sm:inline-flex text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors items-center space-x-1">
          <i data-lucide="shield" class="w-3.5 h-3.5"></i>
          <span>管理后台</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl 2xl:max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-6 space-y-4 flex-1 w-full">

    <!-- KPI Stats & Test Status Overview -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
      <!-- Status Card -->
      <div class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <span class="text-[11px] font-medium text-slate-400 block">测速状态</span>
          <span id="kpiStatus" class="font-bold text-sm sm:text-base text-slate-900 mt-0.5 flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>持续发包测速中</span>
          </span>
        </div>
        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
          <i data-lucide="gauge" class="w-4 h-4"></i>
        </div>
      </div>

      <!-- Packets Progress Card -->
      <div class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <span class="text-[11px] font-medium text-slate-400 block">已发包数</span>
          <span id="kpiPackets" class="font-bold font-mono text-sm sm:text-base text-indigo-600 mt-0.5 block">0 / 100 (0%)</span>
        </div>
        <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center shrink-0">
          <i data-lucide="send" class="w-4 h-4"></i>
        </div>
      </div>

      <!-- Average Latency Card -->
      <div class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <span class="text-[11px] font-medium text-slate-400 block">综合平均延迟</span>
          <span id="kpiAvgLat" class="font-bold font-mono text-sm sm:text-base text-slate-900 mt-0.5 block">-- ms</span>
        </div>
        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
          <i data-lucide="timer" class="w-4 h-4"></i>
        </div>
      </div>

      <!-- Best Line Card -->
      <div class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <span class="text-[11px] font-medium text-slate-400 block">当前最优线路</span>
          <span id="kpiBestNode" class="font-bold text-xs sm:text-sm text-emerald-700 truncate max-w-[150px] mt-0.5 block">--</span>
        </div>
        <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center shrink-0">
          <i data-lucide="zap" class="w-4 h-4"></i>
        </div>
      </div>
    </section>

    <!-- Toolbar: Actions & Interval Settings -->
    <section class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200 shadow-xs space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <!-- Left: Target Description -->
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
          <span class="font-bold text-xs sm:text-sm text-slate-800">在册探针节点实时测速 (5台持续并发发包探测)</span>
        </div>

        <!-- Right: Control Buttons -->
        <div class="flex items-center space-x-2 flex-wrap gap-y-2">
          <!-- Interval selector -->
          <div class="flex items-center space-x-1 text-xs text-slate-500 font-medium">
            <span class="text-[11px] text-slate-400">发包间隔:</span>
            <select id="selectInterval" onchange="changeInterval(this.value)" class="text-xs rounded-lg bg-slate-50 border border-slate-200 px-2 py-1 text-slate-700 font-semibold focus:outline-none cursor-pointer">
              <option value="1000">1.0 秒 / 包</option>
              <option value="500" selected>0.5 秒 (推荐)</option>
              <option value="200">0.2 秒 (极速)</option>
            </select>
          </div>

          <!-- Action Buttons -->
          <button id="btnTogglePlay" onclick="togglePlayPause()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition-all shadow-xs flex items-center space-x-1.5 cursor-pointer active:scale-95">
            <i id="btnToggleIcon" data-lucide="pause" class="w-3.5 h-3.5"></i>
            <span id="btnToggleText">暂停测速</span>
          </button>

          <button onclick="resetAndRestart()" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 font-semibold text-xs transition-all shadow-2xs flex items-center space-x-1.5 cursor-pointer active:scale-95">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>重新测速</span>
          </button>
        </div>
      </div>

      <!-- Overall 100 Packets Progress Bar -->
      <div class="pt-1 space-y-1">
        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
          <div id="overallProgressBar" class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="flex items-center justify-between text-[10px] text-slate-400 font-mono">
          <span id="progressSubText">已启动持续发包测速 (目标连续并发测试 100 包)</span>
          <span id="progressPctText">0%</span>
        </div>
      </div>
    </section>

    <!-- Realtime Test Results Table (Strictly NO IP column, Clean node labels) -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs whitespace-nowrap">
          <thead class="bg-slate-50/90 text-slate-600 font-bold border-b border-slate-200">
            <tr>
              <th class="py-3 px-4 w-48">检测节点</th>
              <th class="py-3 px-4">机房与线路区域</th>
              <th class="py-3 px-3 text-center w-14">丢包</th>
              <th class="py-3 px-3 text-center w-14">发包</th>
              <th class="py-3 px-3 text-center w-16">最新</th>
              <th class="py-3 px-3 text-center w-14">最快</th>
              <th class="py-3 px-3 text-center w-14">最慢</th>
              <th class="py-3 px-3 text-center w-14">平均</th>
              <th class="py-3 px-4 w-60 text-left">
                <span class="flex items-center space-x-1">
                  <i data-lucide="activity" class="w-3.5 h-3.5 text-indigo-600"></i>
                  <span>网络质量 (完整100次)</span>
                </span>
              </th>
            </tr>
          </thead>
          <tbody id="pingTableBody" class="divide-y divide-slate-100">
            <!-- Rendered dynamically via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-white py-4 mt-6">
    <div class="max-w-7xl 2xl:max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-slate-800">Tarnz Probe</span>
        <span>· 持续测速引擎 (100 Packets Monitor)</span>
      </div>
      <div class="flex items-center space-x-3">
        <a href="/" class="hover:text-indigo-600 transition-colors">监控首页</a>
        <span>·</span>
        <a href="/admin" class="hover:text-indigo-600 transition-colors">控制中心</a>
      </div>
    </div>
  </footer>

  <script>
    // -------------------------------------------------------------
    // Global State
    // -------------------------------------------------------------
    const MAX_PACKETS = 100;
    let isRunning = true;
    let timerId = null;
    let currentSeq = 0;
    let pingIntervalMs = 500;

    // Secure node definitions (NO public IP addresses, NO confusing carrier badges)
    const serverNodes = [
      { id: 'node-la', name: '大鸡洛杉矶', flag: '🇺🇸', tag: '主控节点', location: '美国 · 洛杉矶 BGP' },
      { id: 'node-hk', name: '香港 BGP', flag: '🇭🇰', tag: '亚太优选', location: '中国 · 香港 CN2/BGP' },
      { id: 'node-de', name: '艾云德国', flag: '🇩🇪', tag: '欧洲骨干', location: '德国 · 法兰克福' },
      { id: 'node-jp', name: '日本 东京', flag: '🇯🇵', tag: '东亚核心', location: '日本 · 东京机房' },
      { id: 'node-cc', name: 'CC 洛杉矶', flag: '🇺🇸', tag: '北美冗余', location: '美国 · 洛杉矶机房' }
    ];

    let rowsState = {};

    function initRowsState() {
      rowsState = {};
      serverNodes.forEach(item => {
        rowsState[item.id] = {
          ...item,
          sent: 0,
          lost: 0,
          latest: null,
          min: Infinity,
          max: 0,
          sumLat: 0,
          history: [] // array of { success: boolean, latency: number }
        };
      });
      currentSeq = 0;
      renderTable();
      updateKpis();
    }

    // -------------------------------------------------------------
    // ⚡ Zero-GC Table Rendering & In-Place Micro-Slot Patching
    // -------------------------------------------------------------
    function initTableOnce() {
      const tbody = document.getElementById('pingTableBody');
      if (!tbody) return;

      tbody.innerHTML = serverNodes.map(item => {
        let slotsHtml = '';
        for (let i = 0; i < MAX_PACKETS; i++) {
          slotsHtml += `<span id="slot-${item.id}-${i}" class="w-[1.5px] h-[3px] bg-slate-200/80 rounded-2xs inline-block shrink-0 transition-all duration-150" title="第 ${i+1} 包: 待发送"></span>`;
        }

        return `
          <tr id="prow-${item.id}" class="hover:bg-slate-50/80 transition-colors font-mono">
            <!-- 检测节点 -->
            <td class="py-3 px-4 font-sans">
              <div class="flex items-center space-x-2 min-w-0">
                <span class="text-base shrink-0">${item.flag}</span>
                <span class="font-bold text-slate-800 truncate">${item.name}</span>
                ${item.tag ? `<span class="text-[10px] text-indigo-600 bg-indigo-50 border border-indigo-200 px-1.5 py-0.2 rounded shrink-0">${item.tag}</span>` : ''}
              </div>
            </td>

            <!-- 机房与线路区域 -->
            <td class="py-3 px-4 text-slate-600 text-xs font-sans truncate max-w-[200px]" title="${item.location}">
              <span class="inline-flex items-center space-x-1">
                <i data-lucide="map-pin" class="w-3 h-3 text-slate-400 shrink-0"></i>
                <span>${item.location}</span>
              </span>
            </td>

            <!-- 丢包 -->
            <td class="prow-loss py-3 px-3 text-center text-slate-600 font-medium">0%</td>

            <!-- 发包 -->
            <td class="prow-sent py-3 px-3 text-center text-slate-700 font-semibold">0</td>

            <!-- 最新 -->
            <td class="prow-latest py-3 px-3 text-center">--</td>

            <!-- 最快 -->
            <td class="prow-min py-3 px-3 text-center text-slate-600">--</td>

            <!-- 最慢 -->
            <td class="prow-max py-3 px-3 text-center text-slate-600">--</td>

            <!-- 平均 -->
            <td class="prow-avg py-3 px-3 text-center font-bold text-slate-800">--</td>

            <!-- 网络质量 (完整100次发包槽位) -->
            <td class="py-3 px-4 text-left">
              <div class="h-4.5 flex items-end gap-[0.5px] w-[205px] bg-slate-50 p-1 rounded-md border border-slate-200/70 overflow-hidden">
                ${slotsHtml}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function updateRowInPlace(item, slotIdx) {
      const row = rowsState[item.id] || item;
      const tr = document.getElementById(`prow-${item.id}`);
      if (!tr) return;

      const lossRate = row.sent > 0 ? Math.round((row.lost / row.sent) * 100) : 0;
      const avg = (row.sent - row.lost > 0) ? Math.round(row.sumLat / (row.sent - row.lost)) : '--';
      const minStr = (row.min !== Infinity) ? row.min : '--';
      const maxStr = (row.max > 0) ? row.max : '--';

      const lossEl = tr.querySelector('.prow-loss');
      if (lossEl) {
        lossEl.textContent = lossRate + '%';
        lossEl.className = lossRate === 0 ? 'prow-loss py-3 px-3 text-center text-slate-600 font-medium' : 'prow-loss py-3 px-3 text-center text-rose-600 font-bold';
      }

      const sentEl = tr.querySelector('.prow-sent');
      if (sentEl) sentEl.textContent = row.sent;

      const latestEl = tr.querySelector('.prow-latest');
      if (latestEl) {
        if (row.latest === '超时') {
          latestEl.innerHTML = '<span class="text-rose-600 font-bold">超时</span>';
        } else if (typeof row.latest === 'number') {
          latestEl.innerHTML = `<span class="font-bold text-slate-900">${row.latest}</span>`;
        }
      }

      const minEl = tr.querySelector('.prow-min');
      if (minEl) minEl.textContent = minStr;

      const maxEl = tr.querySelector('.prow-max');
      if (maxEl) maxEl.textContent = maxStr;

      const avgEl = tr.querySelector('.prow-avg');
      if (avgEl) avgEl.textContent = avg;

      // Update the exact slot element in-place
      const slotEl = document.getElementById(`slot-${item.id}-${slotIdx}`);
      if (slotEl && row.history.length > slotIdx) {
        const h = row.history[slotIdx];
        if (!h.success) {
          slotEl.className = 'w-[1.5px] h-3.5 bg-rose-500 rounded-2xs inline-block shrink-0';
          slotEl.title = `第 ${slotIdx + 1} 包: 超时`;
        } else {
          const lat = h.latency;
          let hPx = 4;
          if (lat > 200) hPx = 14;
          else if (lat > 120) hPx = 10;
          else if (lat > 60) hPx = 7;
          else hPx = 4;
          slotEl.className = 'w-[1.5px] bg-emerald-500 rounded-2xs inline-block shrink-0 hover:bg-emerald-400';
          slotEl.style.height = `${hPx}px`;
          slotEl.title = `第 ${slotIdx + 1} 包: ${lat} ms`;
        }
      }
    }

    function renderTable() {
      const tbody = document.getElementById('pingTableBody');
      if (!tbody || tbody.children.length === 0) {
        initTableOnce();
      }
    }
    // -------------------------------------------------------------
    // Packet Step (1 round = 1 packet to all nodes)
    // -------------------------------------------------------------
    async function stepPacket() {
      if (!isRunning) return;
      if (currentSeq >= MAX_PACKETS) {
        completeTest();
        return;
      }

      currentSeq++;
      const pct = Math.round((currentSeq / MAX_PACKETS) * 100);
      document.getElementById('kpiPackets').innerText = `${currentSeq} / ${MAX_PACKETS} (${pct}%)`;
      document.getElementById('overallProgressBar').style.width = `${pct}%`;
      document.getElementById('progressPctText').innerText = `${pct}%`;
      document.getElementById('progressSubText').innerText = `正在向各探针节点并发发送第 ${currentSeq} 次测速包...`;

      try {
        const t0 = performance.now();
        const res = await fetch(`/api/client/ping-packet?seq=${currentSeq}&t=${Date.now()}`, { cache: 'no-store' });
        const data = await res.json();
        const masterRtt = Math.max(1, Math.round(performance.now() - t0));

        if (data.ok) {
          const nodeResults = data.nodeResults || {};

          serverNodes.forEach(item => {
            const row = rowsState[item.id];
            if (!row) return;

            row.sent++;
            let lat = null;

            if (item.id === 'node-la') {
              lat = masterRtt;
            } else if (nodeResults[item.id] && nodeResults[item.id].online) {
              lat = nodeResults[item.id].latency;
            }

            if (lat !== null && lat > 0) {
              row.latest = lat;
              row.min = Math.min(row.min, lat);
              row.max = Math.max(row.max, lat);
              row.sumLat += lat;
              row.history.push({ success: true, latency: lat });
            } else {
              row.lost++;
              row.latest = '超时';
              row.history.push({ success: false, latency: -1 });
            }
          });

          serverNodes.forEach(item => {
            updateRowInPlace(item, currentSeq - 1);
          });
          updateKpis();
        }
      } catch (err) {
        console.error('Packet ping error:', err);
      }

      if (isRunning && currentSeq < MAX_PACKETS) {
        timerId = setTimeout(stepPacket, pingIntervalMs);
      } else if (currentSeq >= MAX_PACKETS) {
        completeTest();
      }
    }

    function completeTest() {
      isRunning = false;
      clearTimeout(timerId);
      const statusEl = document.getElementById('kpiStatus');
      if (statusEl) {
        statusEl.innerHTML = '<span class="text-emerald-700 font-bold">✅ 持续测速完成 (共发包 100 次)</span>';
      }
      document.getElementById('progressSubText').innerText = '100 次并发网络质量探测已全部完成！数据已汇总。';
      document.getElementById('btnToggleText').innerText = '测速完成';
      document.getElementById('btnToggleIcon').setAttribute('data-lucide', 'check');
      lucide.createIcons();
    }

    function updateKpis() {
      let totalSum = 0;
      let totalCount = 0;
      let bestName = '--';
      let minAvg = Infinity;

      serverNodes.forEach(item => {
        const row = rowsState[item.id];
        if (!row) return;
        const validCount = row.sent - row.lost;
        if (validCount > 0) {
          const avg = row.sumLat / validCount;
          totalSum += row.sumLat;
          totalCount += validCount;
          if (avg < minAvg) {
            minAvg = avg;
            bestName = `${row.name} (${Math.round(avg)} ms)`;
          }
        }
      });

      if (totalCount > 0) {
        const overallAvg = Math.round(totalSum / totalCount);
        document.getElementById('kpiAvgLat').innerText = `${overallAvg} ms`;
      }
      document.getElementById('kpiBestNode').innerText = bestName;
    }

    // -------------------------------------------------------------
    // Controls: Play / Pause / Reset
    // -------------------------------------------------------------
    function togglePlayPause() {
      if (currentSeq >= MAX_PACKETS) {
        resetAndRestart();
        return;
      }
      isRunning = !isRunning;
      const statusEl = document.getElementById('kpiStatus');
      const btnText = document.getElementById('btnToggleText');
      const btnIcon = document.getElementById('btnToggleIcon');

      if (isRunning) {
        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>持续发包测速中</span>';
        btnText.innerText = '暂停测速';
        btnIcon.setAttribute('data-lucide', 'pause');
        stepPacket();
      } else {
        clearTimeout(timerId);
        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500"></span><span class="text-amber-700">测速已暂停</span>';
        btnText.innerText = '继续测速';
        btnIcon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    function resetAndRestart() {
      clearTimeout(timerId);
      isRunning = true;
      initRowsState();
      document.getElementById('kpiStatus').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>持续发包测速中</span>';
      document.getElementById('btnToggleText').innerText = '暂停测速';
      document.getElementById('btnToggleIcon').setAttribute('data-lucide', 'pause');
      lucide.createIcons();
      stepPacket();
    }

    function changeInterval(val) {
      pingIntervalMs = parseInt(val) || 500;
    }

    // -------------------------------------------------------------
    // Initializer
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initRowsState();
      stepPacket();
    });
  </script>
</body>
</html>
