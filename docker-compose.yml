version: '3.8'

services:
  tanz-probe:
    build: .
    image: tanz-probe:latest
    container_name: tanz-probe
    restart: always
    ports:
      - "5555:5555"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=5555
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:5555/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
